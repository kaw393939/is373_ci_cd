[project]
name = "is373-ci-cd"
version = "0.1.0"
description = "A minimal, observable calculator CI/CD demonstration"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-playwright==0.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
