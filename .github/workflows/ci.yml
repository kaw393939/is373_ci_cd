name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      IMAGE: is373-ci-cd:ci
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Python downloads and Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/python
            .tools/browsers
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}

      - name: Install locked test dependencies
        run: make setup

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Install Chromium and operating-system dependencies
        run: sh scripts/uv.sh run --frozen playwright install --with-deps --only-shell chromium

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Record build time
        id: metadata
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          provenance: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.metadata.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: E2E tests against the release image
        run: make test-e2e

      - name: Authenticate to Docker Hub after passing tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: kaw393939
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Publish the verified image and promote production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py

      - name: Upload test and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
